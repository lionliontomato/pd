<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ebfa">
  <meta name="description" content="布丁の小天地｜布丁の歌單與拉布布の存鑽與存歌整合入口。">
  <title>🍮 布丁の小天地</title>
  <link rel="icon" id="site-favicon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" id="site-favicon-png" type="image/png" href="./favicon.png" disabled>
  <style>
    :root {
      color-scheme: light;
      --bar-height: 66px;
      --ink: #5b4770;
      --muted: #89789b;
      --line: rgba(143, 115, 179, .2);
      --bar: rgba(250, 247, 255, .97);
      --accent: #8f73b3;
      --accent-dark: #72518f;
      --accent-soft: #eee5f7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: #f6f0fc;
      color: var(--ink);
      font-family: "Zen Maru Gothic", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .topbar {
      position: relative;
      z-index: 5;
      flex: 0 0 var(--bar-height);
      min-height: var(--bar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 18px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 3px 14px rgba(109, 78, 143, .08);
      backdrop-filter: blur(12px);
    }
    .brand {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent-dark);
      font-family: "Noto Serif TC", "Noto Sans TC", serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
      user-select: none;
    }
    .brand-icon { font-size: 25px; line-height: 1; }
    .tabs {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }
    .tab {
      appearance: none;
      border: 1px solid rgba(143, 115, 179, .25);
      border-radius: 999px;
      padding: 8px 17px;
      min-height: 39px;
      background: rgba(238, 229, 247, .65);
      color: #72518f;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .tab:hover { transform: translateY(-1px); }
    .tab[aria-selected="true"] {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 3px 9px rgba(109, 78, 143, .2);
    }
    .tab:focus-visible, .open-original:focus-visible {
      outline: 3px solid rgba(143, 115, 179, .32);
      outline-offset: 2px;
    }
    .open-original {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .open-original:hover { color: var(--accent-dark); text-decoration: underline; }
    main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #f6f0fc;
    }
    .site-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }
    .site-frame.is-active { display: block; }
    @media (max-width: 760px) {
      :root { --bar-height: 62px; }
      .topbar { padding: 0 10px; gap: 8px; }
      .brand { font-size: 14px; letter-spacing: 0; gap: 5px; }
      .brand-icon { font-size: 21px; }
      .tabs { gap: 5px; }
      .tab { min-height: 36px; padding: 7px 10px; font-size: 12px; }
      .open-original { font-size: 11px; }
    }
    @media (max-width: 520px) {
      :root { --bar-height: 88px; }
      .topbar {
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 5px 10px;
        padding: 6px 8px;
      }
      .brand { width: 100%; justify-content: center; font-size: 14px; }
      .tabs { justify-content: center; }
      .tab { min-height: 33px; padding: 6px 11px; font-size: 11px; }
      .open-original { position: absolute; right: 9px; top: 9px; font-size: 10px; }
    }
    @media (max-width: 360px) {
      .open-original { top: 7px; right: 6px; font-size: 9px; }
      .tab { padding-inline: 8px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="布丁の小天地">
      <span class="brand-icon" aria-hidden="true">🍮</span>
      <span>布丁の小天地</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="切換網站功能">
      <button class="tab" id="tab-songs" type="button" role="tab" aria-controls="page-songs" aria-selected="true" data-page="songs">♫ 布丁の歌單</button>
      <button class="tab" id="tab-money" type="button" role="tab" aria-controls="page-money" aria-selected="false" data-page="money">☁️ 拉布布の存鑽與存歌</button>
    </nav>
    <a class="open-original" id="open-original" href="https://lionliontomato.github.io/pudding/" target="_blank" rel="noopener noreferrer">在原網站開啟 ↗</a>
  </header>

  <main>
    <iframe
      class="site-frame is-active"
      id="page-songs"
      title="布丁の歌單原始網站"
      src="https://lionliontomato.github.io/pudding/"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <iframe
      class="site-frame"
      id="page-money"
      title="拉布布の存鑽與存歌原始網站"
      data-src="https://lionliontomato.github.io/pm/"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <script>
    (() => {
      const tabs = Array.from(document.querySelectorAll('.tab'));
      const pages = {
        songs: document.getElementById('page-songs'),
        money: document.getElementById('page-money')
      };
      const favicon = document.getElementById('site-favicon');
      const faviconPng = document.getElementById('site-favicon-png');
      const openOriginal = document.getElementById('open-original');
      const puddingUrl = 'https://lionliontomato.github.io/pudding/';
      const pmUrl = 'https://lionliontomato.github.io/pm/';

      function switchPage(name) {
        const selectedPage = pages[name];
        if (!selectedPage) return;

        // 第二個網站在首次切換時才載入，保留原網站的資料讀取流程。
        if (!selectedPage.hasAttribute('src') && selectedPage.dataset.src) {
          selectedPage.src = selectedPage.dataset.src;
        }

        Object.entries(pages).forEach(([key, frame]) => {
          const active = key === name;
          frame.classList.toggle('is-active', active);
          frame.setAttribute('aria-hidden', String(!active));
          frame.tabIndex = active ? 0 : -1;
        });
        tabs.forEach(tab => {
          const active = tab.dataset.page === name;
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex = active ? 0 : -1;
        });

        // 瀏覽器分頁圖示隨目前功能切換，沿用兩個原網站各自的 favicon。
        if (name === 'songs') {
          favicon.href = './favicon.svg';
          faviconPng.disabled = true;
          openOriginal.href = puddingUrl;
          document.title = '布丁歌單｜布丁の小天地';
        } else {
          favicon.href = 'https://lionliontomato.github.io/pm/favicon.svg';
          faviconPng.href = 'https://lionliontomato.github.io/pm/favicon.png';
          faviconPng.disabled = false;
          openOriginal.href = pmUrl;
          document.title = '存鑽存歌｜布丁の小天地';
        }
      }

      tabs.forEach(tab => tab.addEventListener('click', () => switchPage(tab.dataset.page)));
      tabs.forEach((tab, index) => tab.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        const nextIndex = event.key === 'ArrowRight'
          ? (index + 1) % tabs.length
          : (index - 1 + tabs.length) % tabs.length;
        tabs[nextIndex].focus();
        switchPage(tabs[nextIndex].dataset.page);
      }));

      switchPage('songs');
    })();
  </script>
</body>
</html>
